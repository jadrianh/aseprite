name: Compilar Aseprite (Última Release)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Obtener etiqueta de la última Release oficial
        id: latest_release
        shell: bash
        run: |
          TAG=$(curl -s https://github.com | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Última versión detectada: $TAG"

      - name: Descargar código oficial de esa Release
        uses: actions/checkout@v7
        with:
          repository: aseprite/aseprite
          ref: ${{ steps.latest_release.outputs.tag }}
          submodules: recursive

      - name: Configurar MSVC (x64)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Instalar Ninja
        uses: aseprite/get-ninja@main

      - name: Descargar Skia
        shell: bash
        run: |
          skia_url=$(source laf/misc/skia-url.sh | xargs)
          curl --ssl-revoke-best-effort -L -o skia.zip "$skia_url"
          unzip skia.zip -d skia

      - name: Configurar CMake y Compilar
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR="$env:GITHUB_WORKSPACE\skia" -DSKIA_LIBRARY_DIR="$env:GITHUB_WORKSPACE\skia\out\Release-x64" -DSKIA_LIBRARY="$env:GITHUB_WORKSPACE\skia\out\Release-x64\skia.lib" -G Ninja ..
          ninja aseprite

      - name: Empaquetar Aseprite y DLLs
        shell: bash
        run: |
          mkdir -p Aseprite-Compilado
          cp -r build/bin/* Aseprite-Compilado/
          rm -f Aseprite-Compilado/*.pdb Aseprite-Compilado/gen.exe
          cp "$(find /c -name 'libcrypto-3-x64.dll' 2>/dev/null | head -n 1)" Aseprite-Compilado/
          cp "$(find /c -name 'libssl-3-x64.dll' 2>/dev/null | head -n 1)" Aseprite-Compilado/

      - name: Subir ejecutable para descargar
        uses: actions/upload-artifact@v5
        with:
          name: Aseprite-${{ steps.latest_release.outputs.tag }}-Windows
          path: Aseprite-Compilado/
          retention-days: 1
